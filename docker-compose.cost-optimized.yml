version: '3.8'

###############################################################################
# PersonalityMatch - Cost-Optimized Docker Compose
#
# Single VPS deployment with SQLite
# Target cost: $5-8/month (VPS only)
#
# Services:
# - Backend API (Node.js + Express + Socket.io)
# - Redis Cache (optional, in-memory)
# - NGINX Reverse Proxy
#
# Database: SQLite (file-based, no separate container)
###############################################################################

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: personalitymatch-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001

      # Database (SQLite)
      DB_TYPE: sqlite
      SQLITE_PATH: /app/data/personalitymatch.db

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}

      # Wompi Payment (Colombian Gateway)
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY}
      WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY}
      WOMPI_INTEGRITY_SECRET: ${WOMPI_INTEGRITY_SECRET}
      WOMPI_ENVIRONMENT: ${WOMPI_ENVIRONMENT:-sandbox}
      WOMPI_CURRENCY: ${WOMPI_CURRENCY:-COP}
      UNLOCK_PRICE_USD: ${UNLOCK_PRICE_USD:-1.00}
      USD_TO_COP_RATE: ${USD_TO_COP_RATE:-4000}

      # Email (Brevo/Sendinblue Free Tier)
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.sendinblue.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}

      # Redis (optional)
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

      # Frontend
      FRONTEND_URL: ${FRONTEND_URL}

      # Encryption
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # File Upload
      MAX_VIDEO_SIZE: ${MAX_VIDEO_SIZE:-50000000}
      UPLOAD_DIR: /app/uploads

      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}

    volumes:
      # SQLite database (persistent)
      - sqlite_data:/app/data

      # Video uploads
      - backend_uploads:/app/uploads

      # Logs
      - backend_logs:/app/logs

    ports:
      - "3001:3001"

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits (for 4GB VPS)
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Redis Cache (optional, remove to save memory)
  redis:
    image: redis:7-alpine
    container_name: personalitymatch-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # NGINX Reverse Proxy (optional, can use system NGINX instead)
  # Uncomment if running without system NGINX
  # nginx:
  #   image: nginx:alpine
  #   container_name: personalitymatch-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - nginx_ssl:/etc/letsencrypt
  #   depends_on:
  #     - backend

volumes:
  # SQLite database file
  sqlite_data:
    driver: local

  # Redis data
  redis_data:
    driver: local

  # Backend uploads
  backend_uploads:
    driver: local

  # Backend logs
  backend_logs:
    driver: local

  # NGINX SSL certificates
  # nginx_ssl:
  #   driver: local

networks:
  default:
    name: personalitymatch-network

###############################################################################
# Resource Usage Estimate (4GB RAM VPS)
#
# Backend: 512MB - 2GB (depending on load)
# Redis: 256MB - 512MB
# NGINX: ~50MB (if using container)
# System: ~500MB
#
# Total: ~1.3GB - 3.5GB
#
# Headroom for spikes: 500MB - 2.7GB
###############################################################################
